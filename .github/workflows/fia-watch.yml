name: FIA press conference watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fia-watch
  cancel-in-progress: false

env:
  OLLAMA_MODEL: qwen2.5:7b

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_new: ${{ steps.check.outputs.has_new }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules (incl. Puppeteer's bundled Chromium)
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm install

      - name: Cheap check — is there a new transcript at all?
        id: check
        run: |
          result=$(npx tsx scripts/check-new.ts)
          echo "has_new=$result" >> "$GITHUB_OUTPUT"
          echo "Result: $result"

  generate:
    needs: check
    if: needs.check.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules (incl. Puppeteer's bundled Chromium)
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm install

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/ && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL"

      - name: Generate + send stories
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_PROVIDER: ollama
          OLLAMA_BASE_URL: http://localhost:11434
        run: npx tsx scripts/cloud-digest.ts

      - name: Commit updated seen-state
        run: |
          git config user.name "fia-watch-bot"
          git config user.email "actions@github.com"
          git add data/telegram-seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: mark transcripts as seen [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No state change, nothing to commit."
          fi
